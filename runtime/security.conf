# security.conf -- resource profiles for EXEC CICS QUERY SECURITY.
# Managed by CEDA RESCLASS and operator vi.  Format:
#   CLASS:RESID:GROUP=LEVEL,GROUP=LEVEL,...
# RESID ending in * is a generic profile; exact beats generic, longest wins.
# GROUP: a group, * (any signed-on user) or PUBLIC (anyone, signed on or not).
# LEVEL: NONE READ UPDATE CONTROL ALTER (each includes the lower).
# Named groups are checked first (highest wins), then *, then PUBLIC.
# Query only: nothing in this file enforces access.
# CEDA rewrites this file sorted; hand-written comments are not kept.
BANK:ACCOUNT:VIEWER=READ,TELLER=UPDATE,SUPERV=CONTROL,ADMIN=ALTER,PUBLIC=READ
FCICSFCT:CUSTOMERS:PUBLIC=READ,ADMIN=ALTER
FSPF:MENU:*=READ,ADMIN=ALTER
SURROGAT:*:ADMIN=READ
# Strict BANK (sign-on required to look): drop ,PUBLIC=READ above.
# TCICSTRN rows override transactions.conf for QUERY SECURITY only, e.g.
# TCICSTRN:BANK:*=READ,SUPERV=CONTROL,ADMIN=ALTER
